[project]
name = "paper-digest"
version = "0.1.1"
description = "Index arXiv PDFs, ask questions with page-level citations, and get a weekly digest. Built with Pydantic AI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pydantic-ai>=1.0.15",
    "pypdf>=6.0",
    "httpx>=0.28",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.15",
]

[project.scripts]
paper-digest = "paper_digest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_digest"]
